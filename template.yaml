AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Math Tutor Application with Bedrock Nova

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs22.x
    MemorySize: 512
    Environment:
      Variables:
        USER_TABLE: !Ref UserTable
        GAME_SESSION_TABLE: !Ref GameSessionTable
        USER_POOL_ID: !Ref CognitoUserPool
        BEDROCK_REGION: !Ref AWS::Region
        CACHE_TABLE: !Ref PublicStatsCache
        ALLOW_SIGNUPS: !Ref AllowSignups

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod

  AllowSignups:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Set to false to disable new user signups'

Resources:
  # Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub math-tutor-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      EmailVerificationMessage: 'Your Math Tutor verification code is {####}'
      EmailVerificationSubject: 'Verify your Math Tutor account'
      MfaConfiguration: 'OFF'
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: ageGroup
          AttributeDataType: String
          Mutable: true
          DeveloperOnlyAttribute: false
          StringAttributeConstraints:
            MinLength: 1
            MaxLength: 20
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub math-tutor-client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # DynamoDB Tables
  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub math-tutor-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: cognitoId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: CognitoIdIndex
          KeySchema:
            - AttributeName: cognitoId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  GameSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub math-tutor-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  PublicStatsCache:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub math-tutor-public-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Lambda Functions
  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/register.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt UserTable.Arn
      Events:
        RegisterUser:
          Type: Api
          Properties:
            Path: /api/users/register
            Method: post
            RestApiId: !Ref MathTutorApi

  RegisterUserFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${RegisterUserFunction}
      RetentionInDays: 7

  GetUserProfileFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/getUserProfile.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
      Events:
        GetProfile:
          Type: Api
          Properties:
            Path: /api/users/profile
            Method: get
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetUserProfileFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetUserProfileFunction}
      RetentionInDays: 7

  GetUserSessionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/getUserSessions.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionTable
      Events:
        GetSessions:
          Type: Api
          Properties:
            Path: /api/users/sessions
            Method: get
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetUserSessionsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetUserSessionsFunction}
      RetentionInDays: 7

  CreateGameSessionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/createGameSession.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt UserTable.Arn
                - !Sub ${UserTable.Arn}/index/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt GameSessionTable.Arn
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
      Events:
        CreateSession:
          Type: Api
          Properties:
            Path: /api/game/sessions
            Method: post
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  CreateGameSessionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${CreateGameSessionFunction}
      RetentionInDays: 7

  RequestHintFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/requestHint.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
      Events:
        RequestHint:
          Type: Api
          Properties:
            Path: /api/game/sessions/{sessionId}/problems/{problemId}/hints
            Method: post
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  RequestHintFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${RequestHintFunction}
      RetentionInDays: 7

  SubmitAnswerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/submitAnswer.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt UserTable.Arn
                - !Sub ${UserTable.Arn}/index/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameSessionTable.Arn
      Events:
        SubmitAnswer:
          Type: Api
          Properties:
            Path: /api/game/sessions/{sessionId}/problems/{problemId}/submit
            Method: post
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  SubmitAnswerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${SubmitAnswerFunction}
      RetentionInDays: 7

  EndGameSessionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/endGameSession.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt UserTable.Arn
                - !Sub ${UserTable.Arn}/index/*
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt UserTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt GameSessionTable.Arn
      Events:
        EndSession:
          Type: Api
          Properties:
            Path: /api/game/sessions/{sessionId}/end
            Method: post
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  EndGameSessionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${EndGameSessionFunction}
      RetentionInDays: 7

  GetSolutionExplanationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/getSolutionExplanation.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref GameSessionTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
      Events:
        GetExplanation:
          Type: Api
          Properties:
            Path: /api/game/sessions/{sessionId}/problems/{problemId}/explanation
            Method: get
            RestApiId: !Ref MathTutorApi
            Auth:
              Authorizer: CognitoAuthorizer

  GetSolutionExplanationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetSolutionExplanationFunction}
      RetentionInDays: 7

  GetLeaderboardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/getLeaderboard.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PublicStatsCache.Arn
      Events:
        GetLeaderboard:
          Type: Api
          Properties:
            Path: /api/public/leaderboard
            Method: get
            RestApiId: !Ref MathTutorApi

  GetLeaderboardFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetLeaderboardFunction}
      RetentionInDays: 7

  GetActivityStatsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/getActivityStats.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PublicStatsCache.Arn
      Events:
        GetActivityStats:
          Type: Api
          Properties:
            Path: /api/public/activity
            Method: get
            RestApiId: !Ref MathTutorApi

  GetActivityStatsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${GetActivityStatsFunction}
      RetentionInDays: 7

  UpdatePublicStatsCacheFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: backend/
      Handler: functions/updatePublicStatsCache.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource:
                - !GetAtt UserTable.Arn
                - !GetAtt GameSessionTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt PublicStatsCache.Arn
      Events:
        ScheduledUpdate:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Update public stats cache every 15 minutes
            Enabled: true

  UpdatePublicStatsCacheFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${UpdatePublicStatsCacheFunction}
      RetentionInDays: 7

  # API Gateway
  MathTutorApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${MathTutorApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref CognitoUserPoolClient

  UserTableName:
    Description: DynamoDB User Table Name
    Value: !Ref UserTable

  GameSessionTableName:
    Description: DynamoDB Game Session Table Name
    Value: !Ref GameSessionTable
